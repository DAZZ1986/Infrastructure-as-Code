apiVersion: v1
kind: Service
metadata:
  name: jenkins-headless
  namespace: jenkins-second
spec:
  clusterIP: None
  selector:
    app: jenkins          # ← было: "  app: jenkins" без отступа, нужно: "    app: jenkins"
  ports:
    - name: web
      port: 8080
      targetPort: 8080
    - name: agent
      port: 50000
      targetPort: 50000